services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wavewatch
      POSTGRES_USER: wavewatch
      POSTGRES_PASSWORD: wavewatch_dev_password
    volumes:
      - wavewatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavewatch -d wavewatch"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wavewatch:wavewatch_dev_password@db:5432/wavewatch
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
volumes:
  wavewatch_pg:
