services:
  db:
    image: postgres:16-alpine
    container_name: wavewatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wavewatch}
      POSTGRES_USER: ${POSTGRES_USER:-wavewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - wavewatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build: .
    container_name: wavewatch-app
    restart: unless-stopped
    env_file:
      - .env
      - ../secrets/copernicus.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wavewatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wavewatch}
      SECURE_COOKIES: "true"
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - smartfinca_default

  worker:
    build: .
    container_name: wavewatch-worker
    restart: unless-stopped
    command: ["sleep", "infinity"]
    env_file:
      - .env
      - ../secrets/copernicus.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wavewatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wavewatch}
      SECURE_COOKIES: "true"
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  wavewatch_pg:

networks:
  internal:
  smartfinca_default:
    external: true
